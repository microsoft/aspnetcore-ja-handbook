# feature ブランチ用。ビルドが通るかを検証するだけで、デプロイはしない。
# 成果物は artifact として残るので、必要ならダウンロードして手元で確認できる。
name: 'feature: Build only (no deploy)'

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同じ ref で実行中のものがあればキャンセルする（連続 push したときに古い実行を止めるため）。
# push と pull_request では github.ref が別値（refs/heads/xxx と refs/pull/N/merge）に
# なるため両者はキャンセルし合わず、PR がある間は 1 コミットにつき 2 回走る。
# これは意図的で、検証している内容が異なるため。
#   push         … feature ブランチの HEAD そのもの
#   pull_request … main とマージした結果（main が先に進んでいる場合の破損を検知できる）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 間接依存の undici に合わせて Node 22.19.0 以上が必要。22 系の最新版を使う。
          node-version: '>=22.19.0 <23'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 生成物を確認したいとき用。Actions の実行画面からダウンロードできる。
      # dist/ は .gitignore 済みでリポジトリには入らない。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview-${{ github.sha }}
          path: dist/
          retention-days: 7
